name: CI

on:
  push: { branches: [ main, develop ] }
  pull_request: { branches: [ main, develop ] }
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  NODE_ENV: production
  NEXT_PUBLIC_APP_NAME: thecueRoom
  NEXT_PUBLIC_ENV: ci

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      has_playwright: ${{ steps.detect.outputs.has_playwright }}
      has_web: ${{ steps.detect.outputs.has_web }}
      is_export: ${{ steps.detect.outputs.is_export }}
    steps:
      - uses: actions/checkout@v4
      - name: Lockfile discipline (pnpm only)
        run: |
          if [ -f package-lock.json ] || [ -f yarn.lock ]; then
            echo "Remove package-lock.json / yarn.lock. Use pnpm-lock.yaml only."
            exit 1
          fi
          if [ ! -f pnpm-lock.yaml ]; then echo "Generating pnpm-lock.yaml"; fi
      - uses: actions/setup-node@v4
        with: { node-version: 20.x, cache: 'pnpm' }
      - uses: pnpm/action-setup@v4
        with: { version: 9, run_install: false }
      - name: Install (create lockfile if missing)
        run: pnpm install --frozen-lockfile=false
      - name: Detect projects
        id: detect
        run: |
          has_web="false"; [ -d "apps/web" ] && has_web="true"
          has_pw="false"; ls -1 **/playwright.config.* >/dev/null 2>&1 && has_pw="true"
          is_export="false"; grep -R "output:\s*'export'" apps/web/next.config.* >/dev/null 2>&1 && is_export="true"
          echo "has_web=$has_web" >> $GITHUB_OUTPUT
          echo "has_playwright=$has_pw" >> $GITHUB_OUTPUT
          echo "is_export=$is_export" >> $GITHUB_OUTPUT
      - name: Cache turbo (optional)
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

  verify:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.x, cache: 'pnpm' }
      - uses: pnpm/action-setup@v4
        with: { version: 9, run_install: false }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint (no warnings)
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Dependency hygiene (strict)
        run: pnpm depcheck
      - name: Unused files (strict)
        run: pnpm unused

  e2e:
    if: needs.setup.outputs.has_playwright == 'true'
    runs-on: ubuntu-latest
    needs: [setup, verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.x, cache: 'pnpm' }
      - uses: pnpm/action-setup@v4
        with: { version: 9, run_install: false }
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps
      - name: Build & start web (if present)
        run: |
          if [ -d "apps/web" ]; then
            pnpm --filter ./apps/web run build
            pnpm --filter ./apps/web run start &>/dev/null &
            sleep 3
          fi
      - name: Run Playwright
        run: npx playwright test --reporter=line

  build_web:
    if: needs.setup.outputs.has_web == 'true'
    runs-on: ubuntu-latest
    needs: [setup, verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.x, cache: 'pnpm' }
      - uses: pnpm/action-setup@v4
        with: { version: 9, run_install: false }
      - run: pnpm install --frozen-lockfile
      - name: Build web
        working-directory: apps/web
        run: pnpm run build
      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            apps/web/.next
            apps/web/out
            apps/web/reports
          if-no-files-found: warn

  deploy_web_export:
    name: Deploy Web (GitHub Pages, export)
    if: needs.setup.outputs.has_web == 'true' && needs.setup.outputs.is_export == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build_web]
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.x, cache: 'pnpm' }
      - uses: pnpm/action-setup@v4
        with: { version: 9, run_install: false }
      - run: pnpm install --frozen-lockfile
      - name: Export static build
        working-directory: apps/web
        env:
          STATIC_EXPORT: '1'
        run: pnpm run build:static
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/web/out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy_web_vercel:
    name: Deploy Web (Vercel, dynamic)
    if: needs.setup.outputs.has_web == 'true' && needs.setup.outputs.is_export != 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build_web]
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./apps/web